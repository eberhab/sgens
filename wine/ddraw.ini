; Generations default backend profile: cnc-ddraw 7.1.
; The shim owns game coordinates, window geometry, presentation and timing.
[ddraw]
[sgens-wine]
renderer=gdi
hook=0
fixchilds=0
adjmouse=true
maintas=false
boxing=false
minfps=5
nonexclusive=true
savesettings=0
windowed=true
fullscreen=false
devmode=true
resizable=true

; The shim owns Alt+Enter using Win32 window geometry; disable backend hotkeys.
keytogglefullscreen=0
keytogglefullscreen2=0
keytogglemaximize=0
keytogglemaximize2=0
; Retained fallback preferences; the shim does not invoke these toggles.
toggle_borderless=true
toggle_upscaled=true

[sgens-shim]
width=640
height=480
fullscreen=0

; Optional final-image filter owned by the shim, independent of the backend.
; none = existing GDI path; bilinear/bicubic = OpenGL 2.0 shader filtering.
; Read once from this INI beside the shim DLL; restart after editing.
filter=none

; 1 (default): block backend display changes/resets; allow read-only queries.
; 0: leave backend display API imports untouched. Read at game startup.
; Wine prefix XRandR/XVidMode safeguards are independent of this setting.
block_display_changes=1
